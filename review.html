    <!-- 이미지 확대 모달 -->
    <div id="img-modal" class="img-modal">
      <span class="img-modal-close" id="img-modal-close">&times;</span>

      <img class="img-modal-content" id="img-modal-img" alt="확대된 운동후기" />

      <span class="img-modal-arrow left" id="img-prev">&#10094;</span>
      <span class="img-modal-arrow right" id="img-next">&#10095;</span>
    </div>

    <script>
      const images = Array.from(document.querySelectorAll(".review-img-box img"));

      const modal = document.getElementById("img-modal");
      const modalImg = document.getElementById("img-modal-img");
      const closeBtn = document.getElementById("img-modal-close");
      const prevBtn = document.getElementById("img-prev");
      const nextBtn = document.getElementById("img-next");

      let currentIndex = 0;

      function updateArrows() {
        if (currentIndex === 0) {
          prevBtn.style.display = "none";
        } else {
          prevBtn.style.display = "block";
        }

        if (currentIndex === images.length - 1) {
          nextBtn.style.display = "none";
        } else {
          nextBtn.style.display = "block";
        }
      }

      images.forEach((img, index) => {
        img.addEventListener("click", () => {
          currentIndex = index;
          modalImg.src = img.src;
          modal.style.display = "flex";

          updateArrows();
        });
      });

      closeBtn.addEventListener("click", () => {
        modal.style.display = "none";
        modalImg.src = "";
      });

      modal.addEventListener("click", (e) => {
        if (e.target === modal) {
          modal.style.display = "none";
          modalImg.src = "";
        }
      });

      prevBtn.addEventListener("click", (e) => {
        e.stopPropagation();

        if (currentIndex > 0) {
          currentIndex--;
          modalImg.src = images[currentIndex].src;

          updateArrows();
        }
      });

      nextBtn.addEventListener("click", (e) => {
        e.stopPropagation();

        if (currentIndex < images.length - 1) {
          currentIndex++;
          modalImg.src = images[currentIndex].src;

          updateArrows();
        }
      });

      document.addEventListener("keydown", (e) => {
        if (modal.style.display === "flex") {
          if (e.key === "ArrowLeft" && currentIndex > 0) {
            currentIndex--;
            modalImg.src = images[currentIndex].src;

            updateArrows();
          } else if (e.key === "ArrowRight" && currentIndex < images.length - 1) {
            currentIndex++;
            modalImg.src = images[currentIndex].src;

            updateArrows();
          } else if (e.key === "Escape") {
            modal.style.display = "none";
            modalImg.src = "";
          }
        }
      });
    </script>
